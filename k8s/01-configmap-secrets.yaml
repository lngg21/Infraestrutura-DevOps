apiVersion: v1
kind: ConfigMap
metadata:
  name: devops-config
data:
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
---
apiVersion: v1
kind: Secret
metadata:
  name: devops-secret
type: Opaque
stringData:
  DB_USER: "postgres"
  DB_PASSWORD: "postgrespassword"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
data:
  init-db.sql: |
    CREATE DATABASE contracts_db;
    CREATE DATABASE flash_sales;
