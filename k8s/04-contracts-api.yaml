apiVersion: apps/v1
kind: Deployment
metadata:
  name: contracts-api-deployment
  labels:
    app: contracts-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: contracts-api
  template:
    metadata:
      labels:
        app: contracts-api
    spec:
      containers:
        - name: contracts-api
          image: contracts-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: devops-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: devops-config
                  key: DB_PORT
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: devops-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devops-secret
                  key: DB_PASSWORD
            - name: DB_NAME
              value: "contracts_db"
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: devops-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: devops-config
                  key: REDIS_PORT
---
apiVersion: v1
kind: Service
metadata:
  name: contracts-api-service
spec:
  selector:
    app: contracts-api
  ports:
    - port: 3001
      targetPort: 3001
      nodePort: 30001
  type: NodePort
