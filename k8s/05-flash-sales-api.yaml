apiVersion: apps/v1
kind: Deployment
metadata:
  name: flash-sales-api-deployment
  labels:
    app: flash-sales-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flash-sales-api
  template:
    metadata:
      labels:
        app: flash-sales-api
    spec:
      containers:
        - name: flash-sales-api
          image: flash-sales-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              value: "3002"
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: devops-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: devops-config
                  key: DB_PORT
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: devops-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devops-secret
                  key: DB_PASSWORD
            - name: DB_NAME
              value: "flash_sales"
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: devops-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: devops-config
                  key: REDIS_PORT
---
apiVersion: v1
kind: Service
metadata:
  name: flash-sales-api-service
spec:
  selector:
    app: flash-sales-api
  ports:
    - port: 3002
      targetPort: 3002
      nodePort: 30002
  type: NodePort
